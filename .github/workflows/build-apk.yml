name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor packages
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build

      - name: Sync existing Android project
        run: npx cap sync android

      - name: Fix Kotlin dependency conflict
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("build.gradle"),
              Path("build.gradle.kts")
          ]

          gradle_file = next((p for p in candidates if p.exists()), None)

          if gradle_file is None:
              raise SystemExit("Could not find Android root Gradle file")

          text = gradle_file.read_text()

          fix = r'''
          
          // Study Mode Kotlin dependency compatibility fix
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                          details.because("Keep all Kotlin libraries on one compatible version")
                      }
                  }
              }
          }
          '''

          if "Study Mode Kotlin dependency compatibility fix" not in text:
              text += fix
              gradle_file.write_text(text)

          print(f"Updated {gradle_file}")
          PY

      - name: Verify Android project
        working-directory: android
        run: ./gradlew tasks --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Mode-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

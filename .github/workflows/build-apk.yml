name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build Web App
        run: npm run build

      - name: Prepare Android Project
        run: |
          if [ -f "android/gradlew" ]; then
            echo "Complete Android project already exists."
          else
            echo "Android folder is incomplete. Creating a fresh Capacitor project."

            rm -rf /tmp/study-mode-main

            if [ -d "android/app/src/main" ]; then
              mkdir -p /tmp/study-mode-main
              cp -r android/app/src/main/. /tmp/study-mode-main/
              echo "Saved existing native Android code."
            fi

            rm -rf android

            npx cap add android

            if [ -d "/tmp/study-mode-main" ]; then
              cp -r /tmp/study-mode-main/. android/app/src/main/
              echo "Restored native Android code."
            fi
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Clean Build
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Mode-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Check Capacitor
        run: |
          node --version
          npx cap --version

      - name: Build Web App
        run: npm run build

      - name: Generate Android Project
        run: |
          if [ -d "android/app/src/main" ]; then
            mkdir -p /tmp/custom_android_src
            cp -r android/app/src/main/. /tmp/custom_android_src/
          fi

          rm -rf android

          npx cap add android

          if [ -d "/tmp/custom_android_src" ]; then
            cp -r /tmp/custom_android_src/. android/app/src/main/
          fi

          npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: |
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build Web App
        run: npm run build

      - name: Generate Android Project & Restore Custom Kotlin Services
        run: |
          # Backup custom android source files
          if [ -d "android/app/src/main" ]; then
            mkdir -p /tmp/custom_android_src
            cp -r android/app/src/main/* /tmp/custom_android_src/
            rm -rf android
          fi

          # Cleanly initialize Capacitor Android platform
          npx cap add android

          # Restore custom Kotlin services, accessibility config and strings
          if [ -d "/tmp/custom_android_src" ]; then
            cp -r /tmp/custom_android_src/* android/app/src/main/
          fi

          # Sync web assets
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-Mode-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

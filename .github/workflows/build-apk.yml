name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build Web App
        run: npm run build

      - name: Generate Android Project
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            mkdir -p /tmp/study-mode-backup

            if [ -d "android/app/src/main" ]; then
              cp -a android/app/src/main /tmp/study-mode-backup/
            fi

            rm -rf android
          fi

          npx cap add android

          if [ -d "/tmp/study-mode-backup/main" ]; then
            rm -rf android/app/src/main
            cp -a /tmp/study-mode-backup/main android/app/src/main
          fi

          npx cap sync android

      - name: Fix Accessibility Resource
        shell: bash
        run: |
          set -e

          FILE="android/app/src/main/res/values/strings.xml"

          mkdir -p "$(dirname "$FILE")"

          if [ ! -f "$FILE" ]; then
            cat > "$FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Study Mode</string>
              <string name="accessibility_service_description">Study Mode app blocker accessibility service</string>
          </resources>
          EOF
          elif ! grep -q 'accessibility_service_description' "$FILE"; then
            sed -i '/<\/resources>/i\    <string name="accessibility_service_description">Study Mode app blocker accessibility service</string>' "$FILE"
          fi

      - name: Fix Android Manifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/ package="com\.studymode\.timeskip"//' "$MANIFEST"
          fi

      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Clean Android Build
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Mode-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
